[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veloeval"
dynamic = ["version"]
description = "Metrics for benchmarking RNA velocity methods"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "VeloBench contributors" }]
keywords = ["rna-velocity", "single-cell", "benchmark", "metrics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]

# Deliberately light: this package reads an AnnData and returns numbers.
# scvelo is only needed by veloeval.prepare, which runs in the pipeline.
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "anndata>=0.8",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
# scvelo 0.3.3+ does not import on Python 3.8.
prepare = [
    "scvelo>=0.2.5; python_version>='3.9'",
    "scvelo>=0.2.5,<0.3.3; python_version<'3.9'",
    "scanpy>=1.9",
]
plot = ["matplotlib>=3.5"]
# scvelo and scanpy so that the tests comparing against scVelo run, not skip.
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "scvelo>=0.2.5; python_version>='3.9'",
    "scvelo>=0.2.5,<0.3.3; python_version<'3.9'",
    "scanpy>=1.9",
]
docs = [
    "sphinx>=7,<9",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2",
]

[project.urls]
Homepage = "https://github.com/SScottWang/veloeval"

[tool.hatch.version]
path = "veloeval/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["veloeval"]

[tool.ruff]
line-length = 90
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
