# readthedocs.org build configuration.
#
# Connect the repo once at https://readthedocs.org/dashboard/import/ and RTD
# installs a webhook on it.  After that every push rebuilds and republishes:
# `main` becomes the `latest` version, and each git tag becomes its own
# version, so v0.1.0 docs stay readable after main has moved on.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - pdf
