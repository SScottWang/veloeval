name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.8", os: ubuntu-22.04 }  # 3.8 builds are only on the older image
          - { python: "3.11", os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,prepare]"
      - run: ruff check veloeval tests
      - run: pytest -q -rs
